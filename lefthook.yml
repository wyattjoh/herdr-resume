pre-commit:
  parallel: true
  commands:
    oxfmt:
      glob: "*.{js,ts,json,yaml,yml,md}"
      run: bun run format:check {staged_files}
    oxlint:
      glob: "*.{js,ts}"
      run: bun run lint {staged_files}

pre-push:
  parallel: true
  commands:
    typecheck:
      run: bun run typecheck
    test:
      run: bun run test
